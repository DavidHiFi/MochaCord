name: Attach release asset

# Temporary helper: the Arena sandbox cannot reach uploads.github.com, so the
# release asset for v3.1.2 is attached from a runner instead.
on:
  push:
    branches: [arena/01a0fe7c-mochacord]
    paths: ['.github/workflows/attach-release-asset.yml']

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload MochaCord.css to the v3.1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.1.2
          gh release upload v3.1.2 MochaCord.css --clobber
          gh release view v3.1.2 --json assets --jq '.assets[] | {name, size, state}'
