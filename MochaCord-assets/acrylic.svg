<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feGaussianBlur stdDeviation="48"/>
    <feColorMatrix type="saturate" values="1.4"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.05" intercept="-0.025"/>
      <feFuncG type="linear" slope="1.05" intercept="-0.025"/>
      <feFuncB type="linear" slope="1.05" intercept="-0.025"/>
    </feComponentTransfer>
  </filter>
</svg>
